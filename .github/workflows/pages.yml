# Publica el sitio en GitHub Pages en cada push a main (o a mano desde la pestaña Actions).
# Requiere una vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Guía completa: docs/despliegue.md
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si llega un push nuevo, reemplaza a la que estaba en curso.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar el sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Ruta base según la configuración de Pages: base_path es "" con el dominio propio
      # (www.pypulso.online) y "/beat-master-practice" en josegalvez1985.github.io.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ format('{0}/', steps.pages.outputs.base_path) }}

      # Abrir /login o recargar cualquier pantalla: GitHub Pages responde con 404.html,
      # que es la misma app, y el router muestra la pantalla correcta.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
