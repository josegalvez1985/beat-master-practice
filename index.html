<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#100c0a" />
    <!-- Title and description: keep in sync with SITE_TITLE / SITE_DESCRIPTION in src/lib/site.ts. -->
    <title>Pulso — Clases de música en Paraguay: guitarra, arpa, piano</title>
    <meta
      name="description"
      content="Clases de música en Paraguay: tu profesor planifica las clases, tú practicas y subes tu audio o video. Guitarra, arpa paraguaya, piano, batería, voz y más."
    />
    <meta name="application-name" content="Pulso" />
    <!-- Google Search Console: ownership of www.pypulso.online (also public/googled2cf06541ff338e8.html). -->
    <meta name="google-site-verification" content="I_IUZfW79SWIBZyVJClXdasBzxdx_nrO3BR0MrG8P10" />
    <link rel="canonical" href="https://www.pypulso.online/" />

    <!-- Icons: Google search uses the 96px PNG (multiple of 48); browsers prefer the SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews (WhatsApp, Facebook, X, LinkedIn…). Absolute URLs on purpose. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pulso" />
    <meta property="og:locale" content="es_PY" />
    <meta property="og:url" content="https://www.pypulso.online/" />
    <meta
      property="og:title"
      content="Pulso — Clases de música en Paraguay: guitarra, arpa, piano"
    />
    <meta
      property="og:description"
      content="Tu profesor planifica las clases y sube los materiales; tú practicas, subes tu audio o video y ves tu progreso. Guitarra, arpa paraguaya, piano, batería y más."
    />
    <meta property="og:image" content="https://www.pypulso.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo de Pulso: una línea de pulso ámbar. Clases y práctica de música en Paraguay."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Site name (WebSite) and logo (Organization) for Google search results. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.pypulso.online/#website",
            "name": "Pulso",
            "alternateName": ["Pulso Paraguay", "pypulso"],
            "url": "https://www.pypulso.online/",
            "description": "Clases de música en Paraguay: tu profesor planifica las clases, tú practicas y subes tu audio o video. Guitarra, arpa paraguaya, piano, batería, voz y más.",
            "inLanguage": "es-PY",
            "publisher": { "@id": "https://www.pypulso.online/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://www.pypulso.online/#organization",
            "name": "Pulso",
            "alternateName": "Pulso Paraguay",
            "url": "https://www.pypulso.online/",
            "logo": "https://www.pypulso.online/icons/icon-512.png",
            "image": "https://www.pypulso.online/og-image.png",
            "description": "Plataforma para enseñar y practicar instrumentos musicales en Paraguay: guitarra, arpa paraguaya, piano, batería, voz, bajo, violín, acordeón, ukelele, saxofón y flauta.",
            "areaServed": { "@type": "Country", "name": "Paraguay" }
          }
        ]
      }
    </script>
    <!-- Theme before the first paint (no flash); src/lib/theme.ts takes over after. -->
    <script>
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem("pulso-tema");
        } catch (e) {}
        var claro =
          tema === "claro" ||
          (tema !== "oscuro" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = claro ? "light" : "dark";
      })();
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #100c0a;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background-color: #faf7f2;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      .previa {
        margin: auto;
        max-width: 32rem;
        padding: 0 24px;
        text-align: center;
        font-family: system-ui, sans-serif;
        color: #a69d91;
      }
      .previa h1 {
        font-size: 1.25rem;
        color: #f8f5ef;
      }
      html[data-theme="light"] .previa {
        color: #6b6158;
      }
      html[data-theme="light"] .previa h1 {
        color: #1c1714;
      }
    </style>
  </head>

  <body>
    <noscript>Necesitas activar JavaScript para usar Pulso.</noscript>
    <!-- What Pulso is, in the HTML itself: shown while the app loads and readable without
         JavaScript (Google reads it before rendering). React replaces it on the first render. -->
    <div id="root">
      <main class="previa">
        <h1>Pulso: clases y práctica de música en Paraguay</h1>
        <p>
          Tu profesor planifica las clases y sube los materiales; tú practicas, subes tu audio o
          video y ves tu progreso.
        </p>
        <p>
          Guitarra, arpa paraguaya, piano, batería, voz, bajo, violín, acordeón, ukelele, saxofón y
          flauta.
        </p>
      </main>
    </div>
    <!-- react-native-web's Animated calls `global.cancelAnimationFrame`; `global` only exists in Node. -->
    <script>
      globalThis.global = globalThis;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
