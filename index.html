<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#100c0a" />
    <title>Pulso — Clases de música y práctica de instrumentos en Paraguay</title>
    <meta
      name="description"
      content="Profesores y alumnos de música en Paraguay: clases planificadas, materiales, prácticas en audio o video y progreso. Guitarra, arpa paraguaya, piano, batería y más."
    />
    <meta name="application-name" content="Pulso" />
    <!-- Google Search Console: ownership of www.pypulso.online (also public/googled2cf06541ff338e8.html). -->
    <meta name="google-site-verification" content="I_IUZfW79SWIBZyVJClXdasBzxdx_nrO3BR0MrG8P10" />
    <link rel="canonical" href="https://www.pypulso.online/" />

    <!-- Icons: Google search uses the 96px PNG (multiple of 48); browsers prefer the SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews (WhatsApp, Facebook, X, LinkedIn…). Absolute URLs on purpose. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pulso" />
    <meta property="og:locale" content="es_PY" />
    <meta property="og:url" content="https://www.pypulso.online/" />
    <meta property="og:title" content="Pulso — Clases y práctica de música en Paraguay" />
    <meta
      property="og:description"
      content="Tu profesor planifica las clases y sube los materiales; tú practicas, subes tu audio o video y ves tu progreso. Guitarra, arpa paraguaya, piano, batería y más."
    />
    <meta property="og:image" content="https://www.pypulso.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo de Pulso: una línea de pulso ámbar. Clases y práctica de música en Paraguay."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Site name and logo for Google search results. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Pulso",
            "alternateName": "pypulso",
            "url": "https://www.pypulso.online/",
            "inLanguage": "es-PY"
          },
          {
            "@type": "Organization",
            "name": "Pulso",
            "url": "https://www.pypulso.online/",
            "logo": "https://www.pypulso.online/icons/icon-512.png"
          }
        ]
      }
    </script>
    <!-- Theme before the first paint (no flash); src/lib/theme.ts takes over after. -->
    <script>
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem("pulso-tema");
        } catch (e) {}
        var claro =
          tema === "claro" ||
          (tema !== "oscuro" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = claro ? "light" : "dark";
      })();
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #100c0a;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background-color: #faf7f2;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Necesitas activar JavaScript para usar Pulso.</noscript>
    <div id="root"></div>
    <!-- react-native-web's Animated calls `global.cancelAnimationFrame`; `global` only exists in Node. -->
    <script>
      globalThis.global = globalThis;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
